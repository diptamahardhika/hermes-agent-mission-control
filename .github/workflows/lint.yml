name: Lint CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Real merge gate. This change cleared the repo's error backlog: the
      # 20 CI-visible errors were the two max-lines breaches in
      # articles/page.tsx and readme-validator.ts, plus the CommonJS/any
      # errors in the tracked seed scripts and scanner tooling (relaxed via
      # scoped overrides in eslint.config.mjs, not rewritten). So
      # `continue-on-error` is gone.
      #
      # Warnings are NOT gated: 122 pre-existing warnings remain, so a
      # --max-warnings threshold would fail every PR until the whole backlog
      # is cleared. Errors gate; warnings stay advisory.
      - name: Lint
        run: npm run lint
