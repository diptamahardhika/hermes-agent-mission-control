name: Lint CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Report-only, not a merge gate. Next.js 16 dropped ESLint from
      # `next build`, so nothing catches lint regressions today. This job
      # restores visibility, but the repo carries a pre-existing error
      # backlog, so a hard gate would fail every PR until it is cleared.
      # Delete `continue-on-error` once the error count reaches zero.
      #
      # Note: this also surfaces max-lines on src/app/articles/page.tsx
      # (2401 lines) for the first time — see eslint.config.mjs.
      - name: Lint
        continue-on-error: true
        run: npm run lint
