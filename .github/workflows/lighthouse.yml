name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./prisma/dev.db'

      - name: Start Next.js server
        run: PORT=8888 npm run start &

      - name: Wait for server
        run: sleep 10 && curl -sf http://localhost:8888/ > /dev/null

      - name: Run Lighthouse
        run: |
          mkdir -p .lighthouse
          npx lighthouse http://localhost:8888/ --output=json --output=path=.lighthouse/results --preset=desktop --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage"
        env:
          CI: 'true'

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: .lighthouse/
          retention-days: 7