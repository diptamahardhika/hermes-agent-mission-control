name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./prisma/dev.db'

      - name: Start Next.js server
        run: PORT=8888 npm run start &

      - name: Wait for server
        run: sleep 10 && curl -sf http://localhost:8888/ > /dev/null

      # Run LHCI, not raw `lighthouse`. The previous step shelled out to the
      # lighthouse CLI and only uploaded a JSON report — lighthouse.config.js was
      # never read, so every assertion in it (including the 0.5 performance
      # floor) was dead code and a score of 0.1 would still have passed.
      #
      # Uses `npx @lhci/cli` explicitly, NOT the repo's `npm run lighthouse`
      # script: that script calls a bare `lighthouse ci`, and @lhci/cli is not
      # a devDependency, so it only resolves if lhci happens to be installed
      # globally. It never was, so the script cannot run on a clean runner.
      - name: Run Lighthouse
        run: |
          sudo apt-get install -y xvfb
          xvfb-run npx --yes @lhci/cli@0.14.0 autorun --config=lighthouse.config.js
        env:
          CI: 'true'

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: .lighthouse-ci/
          retention-days: 7