name: Smoke Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./prisma/dev.db'

      - name: Start Next.js server
        run: PORT=8888 npm run start &

      - name: Wait for server
        run: sleep 10 && curl -sf http://localhost:8888/api/hermes/health > /dev/null

      # SKIP_WEBSERVER: the server is already running above, so the config's
      # webServer block is disabled rather than starting a second instance.
      - name: Run smoke tests
        run: npm test
        env:
          SKIP_WEBSERVER: '1'
          BASE_URL: 'http://localhost:8888'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
