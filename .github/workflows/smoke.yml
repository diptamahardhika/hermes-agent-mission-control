name: Smoke Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./prisma/dev.db'

      - name: Start Next.js server
        run: PORT=8888 npm run start &

      # Wait for the server to actually serve. Polling `/` rather than
      # /api/hermes/health: the health route queries Postgres, which is not
      # available in CI, so it would hang and time out here.
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/ > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up in 30s"
          exit 1

      # SKIP_WEBSERVER: the server is already running above, so the config's
      # webServer block is disabled rather than starting a second instance.
      - name: Run smoke tests
        run: npm test
        env:
          SKIP_WEBSERVER: '1'
          BASE_URL: 'http://localhost:8888'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
