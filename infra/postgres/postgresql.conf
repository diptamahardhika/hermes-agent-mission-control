# ─── Hermy HQ PostgreSQL 16 Configuration ─────────────────────────────
# Optimized for: mixed OLTP + analytical workloads, connection pooling via PgBouncer
# Target: 2GB RAM container, 2 vCPU

# ─── Connection & Authentication ───────────────────────────────────────
listen_addresses = '*'
max_connections = 100                  # PgBouncer handles client concurrency
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'
password_encryption = scram-sha-256

# ─── Memory (Tuned for 2GB container) ──────────────────────────────────
shared_buffers = 512MB                 # 25% of RAM
effective_cache_size = 1536MB          # 75% of RAM (OS cache + shared_buffers)
work_mem = 16MB                        # Per-operation sort/hash memory
maintenance_work_mem = 256MB           # Vacuum, index creation
autovacuum_work_mem = 128MB
max_parallel_maintenance_workers = 2
huge_pages = try                       # Try to use huge pages

# ─── Write-Ahead Log (WAL) ─────────────────────────────────────────────
wal_level = replica                    # Required for streaming replication / pgBackRest
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

# ─── Query Planner ─────────────────────────────────────────────────────
random_page_cost = 1.1                 # SSD/NVMe storage
effective_io_concurrency = 200         # NVMe can handle high concurrency
jit = on                               # Just-in-time compilation for complex queries
jit_above_cost = 100000

# ─── Parallelism ───────────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
parallel_leader_participation = on

# ─── Autovacuum (Critical for performance) ─────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05  # More aggressive than default 0.2
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = 10ms

# ─── Logging ───────────────────────────────────────────────────────────
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000      # Log slow queries > 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 500ms
log_statement = 'ddl'

# ─── Replication (for future scaling) ──────────────────────────────────
max_wal_senders = 3
max_replication_slots = 3
hot_standby = on

# ─── Extensions ────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = off
pg_stat_statements.save = on
auto_explain.log_min_duration = 2000
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_format = 'json'
# pg_cron not in stock postgres:16-bookworm image — re-enable with custom image if needed
# cron.database_name = 'hermy_hq'

# ─── Client Connection Defaults ────────────────────────────────────────
default_transaction_isolation = 'read committed'
default_table_access_method = 'heap'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# ─── Security ──────────────────────────────────────────────────────────
# Local dev: SSL off. Container binds to 127.0.0.1 only, no network exposure.
# For remote/Umbrel: re-enable ssl = on and mount certs.
ssl = off
# ssl_min_protocol_version = 'TLSv1.2'
# ssl_cert_file, ssl_key_file mounted via secrets in production