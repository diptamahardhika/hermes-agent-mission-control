<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2029"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <!-- H: Geist-like proportions (bold, tight), centered -->
  <g fill="url(#h)">
    <!-- left stem: slightly wider, rounded ends via rects -->
    <rect x="17" y="16" width="9" height="32" rx="4.5"/>
    <!-- right stem -->
    <rect x="38" y="16" width="9" height="32" rx="4.5"/>
    <!-- crossbar -->
    <rect x="21" y="27.5" width="22" height="9" rx="4.5"/>
  </g>
  <!-- live dot -->
  <circle cx="49" cy="15" r="6" fill="#34D399"/>
</svg>
