services:
  hermy-hq-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermy-hq-dashboard
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/hermes.db
      - NEXTAUTH_SECRET=change-me-in-production
      - INTERNAL_API_SECRET=hermes-internal-secret-change-me
    volumes:
      - hermes-data:/data
    networks:
      - default
      - hermy-infra
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/hermes/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
  hermy-infra:
    external: true

volumes:
  hermes-data: